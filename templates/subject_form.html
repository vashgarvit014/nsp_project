{% extends "base.html" %}
{% block title %}Add Subject{% endblock %}
{% block header %}Add Subject{% endblock %}
{% block content %}

<div class="card-panel" style="max-width: 560px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label">Subject Name</label>
                <input type="text" name="name" class="form-control" required value="{{ form.name if form else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Subject Code</label>
                <input type="text" name="code" class="form-control" required value="{{ form.code if form else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Semester</label>
                <input type="number" min="1" max="8" name="semester" class="form-control" required value="{{ form.semester if form else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Section</label>
                <input type="text" name="section" class="form-control" required value="{{ form.section if form else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" required value="{{ form.department if form else '' }}">
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('teacher.subjects') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
