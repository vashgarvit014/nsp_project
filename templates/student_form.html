{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'Add' }} Student{% endblock %}
{% block header %}{{ 'Edit Student' if student else 'Add Student' }}{% endblock %}
{% block content %}

<div class="card-panel" style="max-width: 640px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required
                       value="{{ (form.full_name if form else student.full_name) or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_number" class="form-control" required
                       value="{{ (form.roll_number if form else student.roll_number) or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required
                       value="{{ (form.email if form else student.email) or '' }}">
            </div>
            {% if not student %}
            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            {% endif %}
            <div class="col-md-4">
                <label class="form-label">Semester</label>
                <input type="number" min="1" max="8" name="semester" class="form-control" required
                       value="{{ (form.semester if form else student.semester) or '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Section</label>
                <input type="text" name="section" class="form-control" required
                       value="{{ (form.section if form else student.section) or '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" required
                       value="{{ (form.department if form else student.department) or '' }}">
            </div>
        </div>
        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('teacher.students') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
