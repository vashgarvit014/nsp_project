services:
  - type: web
    name: smart-curriculum-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "python -c \"from seed import seed_if_empty; seed_if_empty()\" && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
